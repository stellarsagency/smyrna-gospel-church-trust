<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Praying for Suffering and Persecuted Christians</title>

<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root{
  --navy:#0c1c3a;
  --navy-soft:#122650;
  --gold:#cbb681;
  --gold-light:#e0cf9e;
  --white:#ffffff;
  --muted-white:#e2e8f0;
  --serif:Georgia, 'Merriweather', 'Times New Roman', serif;
  --ease:cubic-bezier(.25,.6,.3,1);
}

/* ============================================================
   RESET / BASE
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--serif);
  background:var(--navy);
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ============================================================
   HERO — 2-column split
   ============================================================ */
.hero{
  position:relative;
  width:100%;
  min-height:100vh;
  min-height:100dvh;
  background:var(--navy);
  color:var(--white);
  overflow:hidden;
  display:flex;
}

/* Subtle glow behind the text for depth */
.hero::before{
  content:"";
  position:absolute;
  inset:0;
  background:radial-gradient(800px 500px at 18% 40%,rgba(203,182,129,.10),transparent 60%);
  pointer-events:none;
}

.hero-grid{
  position:relative;
  z-index:2;
  width:100%;
  display:grid;
  grid-template-columns:1fr 1fr; /* 50% / 50% */
}

/* ============================================================
   LEFT COLUMN — text
   ============================================================ */
.hero-content{
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:flex-start;
  padding:clamp(3rem,8vw,7rem) 5%;
}

.hero-content .kick{
  font-size:.8rem;
  letter-spacing:.28em;
  text-transform:uppercase;
  color:var(--gold);
  margin-bottom:28px;
  font-family:var(--serif);
  opacity:0;
  animation:fadeUp .9s var(--ease) .1s forwards;
}

.hero-content h1{
  font-family:var(--serif);
  font-weight:400;
  font-size:clamp(2.4rem,4.6vw,3.4rem);
  line-height:1.16;
  color:var(--white);
  letter-spacing:-.01em;
  opacity:0;
  animation:fadeUp .9s var(--ease) .25s forwards;
}

/* Accent line */
.hero-accent{
  width:96px;
  height:2px;
  background:var(--gold);
  margin:34px 0 30px;
  border-radius:2px;
  opacity:0;
  animation:fadeUp .9s var(--ease) .4s forwards;
}

.hero-quote{
  font-family:var(--serif);
  font-size:clamp(1.05rem,1.6vw,1.35rem);
  line-height:1.7;
  color:var(--muted-white);
  font-style:italic;
  max-width:520px;
  opacity:0;
  animation:fadeUp .9s var(--ease) .55s forwards;
}

.hero-quote .verse{
  display:block;
  margin-top:14px;
  color:var(--gold-light);
  font-style:normal;
  font-size:.95em;
  letter-spacing:.02em;
}

/* ============================================================
   RIGHT COLUMN — praying hands image (bleeds right)
   ============================================================ */
.hero-media{
  position:relative;
  min-height:100vh;
  min-height:100dvh;
  overflow:hidden;
}

.hero-media img{
  position:absolute;
  top:0;
  right:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:right center; /* hands face left/center */
  opacity:0;
  animation:heroFade 1.6s var(--ease) .3s forwards;
}

/* Soft blend so image melts into the navy on the left edge */
.hero-media::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(90deg,var(--navy) 0%,rgba(12,28,58,.18) 22%,rgba(12,28,58,0) 45%);
  pointer-events:none;
}

/* ============================================================
   ANIMATIONS
   ============================================================ */
@keyframes fadeUp{
  from{opacity:0;transform:translateY(22px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes heroFade{
  from{opacity:0;transform:scale(1.03)}
  to{opacity:1;transform:scale(1)}
}

/* ============================================================
   RESPONSIVE — < 768px stack vertically
   ============================================================ */
@media (max-width:767px){
  .hero{min-height:auto;display:block}
  .hero-grid{grid-template-columns:1fr;grid-template-rows:auto auto}
  .hero-content{
    padding:4.5rem 1.5rem 3rem;
    align-items:flex-start;
    text-align:left;
  }
  .hero-content h1{font-size:2rem}
  .hero-accent{margin:24px 0 22px}
  .hero-quote{font-size:1.05rem}
  .hero-media{
    min-height:auto;
    order:2;
  }
  .hero-media img{
    position:relative;
    width:100%;
    height:auto;
    max-height:60vh;
    object-fit:cover;
    object-position:center 30%;
  }
  .hero-media::after{
    background:linear-gradient(0deg,var(--navy) 0%,rgba(12,28,58,.10) 30%,rgba(12,28,58,0) 60%);
  }
}

/* Small phones */
@media (max-width:420px){
  .hero-content{padding:3.5rem 1.25rem 2.5rem}
  .hero-content h1{font-size:1.75rem}
}
</style>
</head>

<body>

<!-- ============================================================
     HERO SECTION — Praying for Suffering and Persecuted Christians
     ============================================================ -->
<section class="hero">
  <div class="hero-grid">

    <!-- LEFT COLUMN : Text -->
    <div class="hero-content">
      <span class="kick">A Community in Faith &middot; Standing Together</span>

      <h1>Praying for Suffering and Persecuted Christians</h1>

      <div class="hero-accent" aria-hidden="true"></div>

      <p class="hero-quote">
        &ldquo;If the world hates you, know that it has hated me before it hated you.&rdquo;
        <span class="verse">&mdash; John 15:18</span>
      </p>
    </div>

    <!-- RIGHT COLUMN : Photo of a boy with hands together in prayer -->
    <div class="hero-media">
      <img
        src="Prayer.png"
        alt="A boy with both hands together in prayer"
        loading="eager"
        fetchpriority="high"
      />
    </div>

  </div>
</section>

</body>
</html>
